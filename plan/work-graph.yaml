# Work graph of the solution components still to build, for parallel work.
#
# Drafted by Claude on 2026-11-05 from docs/implementation-plan.md, the SC and TC files in graph/
# and the "Pending" notes in backend/test/integration/. It awaits the owner's confirmation.
#
# One node is one GitHub issue. A node holds one SC, or a few small SCs that belong together.
# blocked_by lists the nodes that must be merged before the node can start. It becomes the
# issue's "blocked by" relations.
#
# TCs: a TC is linked to the FRs it verifies, not to an SC, so a TC is given to every node
# whose SC delivers one of its FRs. Where several nodes share a TC, each one takes a part:
#   full     - this node makes the TC pass in full.
#   part     - this node tests what it builds; `part` says which steps or which channel.
# The usual split: a backend node tests the service and REST API side, and the frontend node
# with the screen tests the same TC's browser steps.
#
# SC-073 (migrations), SC-026 (REST routes), SC-063 (OpenAPI), SC-028 (image) and SC-029 (Compose)
# are tracks: every backend node adds its tables and migration, its routes and their OpenAPI
# description. They are closed in Z01.

