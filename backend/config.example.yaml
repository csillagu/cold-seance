# The tool's configuration (DD-059). Copy it to config.yaml next to where the backend starts, or
# name another file with COLD_SEANCE_CONFIG_FILE. Every setting can also be given by the
# environment variable shown beside it, which wins over this file. Keep this file and the key
# files readable only by the user the tool runs as: they hold the tool's secrets.

server:
  # The address the backend listens on; 127.0.0.1 if not set.           COLD_SEANCE_SERVER_HOST
  # The Docker image sets 0.0.0.0, so that its published port reaches it.
  # host: 127.0.0.1
  # The port it listens on; 3000 if not set.                             COLD_SEANCE_SERVER_PORT
  # port: 3000

database:
  # Required. The PostgreSQL database the tool stores its data in.       COLD_SEANCE_DATABASE_URL
  # The Compose install's bundled database (compose.yaml) is
  # postgres://cold_seance:cold_seance@database:5432/cold_seance
  url: postgres://cold_seance:change-me@localhost:5432/cold_seance
  # A direct (not pooled) connection for migrations; url if not set.     COLD_SEANCE_DATABASE_DIRECT_URL
  # directUrl: postgres://cold_seance:change-me@direct.example:5432/cold_seance

github:
  # The re-check of linked issues, in minutes; 60 if not set.            COLD_SEANCE_GITHUB_RECHECK_INTERVAL_MINUTES
  # recheckIntervalMinutes: 60

  # Each function (readIssues, writeIssues, projectsStatus) is given either a GitHub App, under
  # apps, or a personal access token, under tokens: not both, and not neither, or the tool does not
  # start. Apps and tokens can be mixed across functions, and one App or one token can serve several
  # (the YAML anchors below do that).
  #
  # An App: appId and privateKeyFile are required; webhookSecret only if the App sends webhooks.
  apps:
    readIssues:
      &app #                                                   COLD_SEANCE_GITHUB_APPS_READ_ISSUES_APP_ID
      appId: 123456 #                                                    ..._PRIVATE_KEY_FILE, ..._WEBHOOK_SECRET
      privateKeyFile: /run/secrets/github-app.pem
      # webhookSecret: change-me
    writeIssues: *app #                                                  COLD_SEANCE_GITHUB_APPS_WRITE_ISSUES_...
    projectsStatus: *app #                                               COLD_SEANCE_GITHUB_APPS_PROJECTS_STATUS_...


  # A personal access token, as its value, used as the GitHub account that owns it. The environment
  # variable keeps it out of this file. Remove a function from apps above before giving it a token;
  # to remove readIssues, which holds the &app anchor, move the anchor to a function that stays.
  # tokens:
  #   readIssues: &token github_pat_change-me #                        COLD_SEANCE_GITHUB_TOKENS_READ_ISSUES
  #   writeIssues: *token #                                            COLD_SEANCE_GITHUB_TOKENS_WRITE_ISSUES
  #   projectsStatus: *token #                                         COLD_SEANCE_GITHUB_TOKENS_PROJECTS_STATUS

  # The one secret of the webhooks set up on repositories and organizations, if any are used.
  # webhookSecret: change-me #                                         COLD_SEANCE_GITHUB_WEBHOOK_SECRET

# The first system admin, created at start while there is no system admin yet; once one exists,
# these change nothing. Give both, or neither. The environment variables keep the password out of
# this file; sign in with them, then create everyone else's account.
# firstAdmin:
#   username: root #                                                   COLD_SEANCE_FIRST_ADMIN_USERNAME
#   password: change-me #                                              COLD_SEANCE_FIRST_ADMIN_PASSWORD
