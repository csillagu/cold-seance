name: Bug report
description: Something in cold-seance does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; see [SECURITY.md](https://github.com/csillagu/cold-seance/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag (`sha-<commit>`) or the commit you run.
  - type: textarea
    id: deployment
    attributes:
      label: Deployment
      description: How the tool runs (Docker Compose, the image alone, from source), the database, and whether GitHub Apps or tokens are used. Leave out secrets.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant part of the backend's log, with secrets removed.
      render: text
