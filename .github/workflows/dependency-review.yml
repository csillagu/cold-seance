name: Dependency review

# Fails a pull request that adds a dependency with a known vulnerability of high or critical
# severity, or under a license that is not on the allow list below (#226). Dependabot's alerts and
# security updates cover the dependencies already on main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub offers the dependency graph this needs to private repositories only with Advanced
    # Security, so the job runs once the repository is public.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Licenses compatible with distributing cold-seance under Apache-2.0 (#226). MPL-2.0 and
          # EPL-2.0 are file-level copyleft, compatible as long as their files are used unmodified;
          # today only development tools use them (lightningcss, elkjs).
          allow-licenses: >-
            Apache-2.0, MIT, MIT-0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0,
            Unlicense, OFL-1.1, MPL-2.0, EPL-2.0
          comment-summary-in-pr: never
