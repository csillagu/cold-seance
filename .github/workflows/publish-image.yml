name: Publish the image

# Publishes the application image (SC-028) to the GitHub Container Registry, built from the commit
# of the run that calls it, for x86 and ARM (DD-040), with the tags the caller gives and always its
# commit tag, `sha-<commit>`. Called by CI on a manual dispatch on main, which gives `main`, and by
# the image release (SC-130), which gives the version and, for a final release, `latest`. The caller
# runs the image's tests first.
on:
  workflow_call:
    inputs:
      tags:
        description: The tags besides `sha-<commit>`, one per line, as docker/metadata-action reads them.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # QEMU runs the ARM build on the x86 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` only where the caller asks for it, never by the action's own rules.
          flavor: latest=false
          tags: |
            ${{ inputs.tags }}
            type=sha,format=long
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
