name: Publish the image

# Publishes the application image (SC-028) to the GitHub Container Registry, built from the commit
# of the run that calls it, for x86 and ARM (DD-040), with the tags the caller gives and always its
# commit tag, `sha-<commit>`. Called by CI on a manual dispatch on main, which gives `main`, and by
# the image release (SC-130), which gives the version and, for a final release, `latest`. The caller
# runs the image's tests first.
on:
  workflow_call:
    inputs:
      tags:
        description: The tags besides `sha-<commit>`, one per line, as docker/metadata-action reads them.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # QEMU runs the ARM build on the x86 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` only where the caller asks for it, never by the action's own rules.
          flavor: latest=false
          tags: |
            ${{ inputs.tags }}
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
