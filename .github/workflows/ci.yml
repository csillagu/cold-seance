name: CI

# Runs on pull requests to main and on manual dispatch; not on pushes to main (#196).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Format, lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:check

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Coverage summary
        run: node scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: |
            backend/coverage/
            frontend/coverage/
          retention-days: 14

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The PostgreSQL service and its address are shared with the browser tests' job below.
    services: &postgres-service
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: &postgres-env
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  # The browser tests (node P01): the test cases' browser steps, in Chromium, against the backend
  # serving the built frontend, each test on a database of its own.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services: *postgres-service
    env: *postgres-env
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Chromium of the installed Playwright version, with the system libraries it needs.
      - run: npx --workspace e2e playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  # The live GitHub tests (SC-128, SC-129, DD-063): against real GitHub, the test repository and
  # a backend the suite starts in this job, on the PostgreSQL service. They take their settings
  # from the `live` environment, which Terraform writes (SC-125); a missing one fails the job,
  # naming it. Every run, of every pull request and of the deployment's workflow, works in the one
  # test repository, so they wait for each other in one concurrency group.
  live:
    name: Live GitHub tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: live
    concurrency:
      group: live-github-tests
      cancel-in-progress: false
    services: *postgres-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:live:local
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          LIVE_GITHUB_APP_ID: ${{ vars.LIVE_GITHUB_APP_ID }}
          LIVE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.LIVE_GITHUB_APP_PRIVATE_KEY }}
          LIVE_GITHUB_REPOSITORY: ${{ vars.LIVE_GITHUB_REPOSITORY }}
          LIVE_GITHUB_TOKEN: ${{ secrets.LIVE_GITHUB_TOKEN }}
          LIVE_GITHUB_PROJECTS_TOKEN: ${{ secrets.LIVE_GITHUB_PROJECTS_TOKEN }}
          LIVE_GITHUB_PROJECT_OWNER: ${{ vars.LIVE_GITHUB_PROJECT_OWNER }}
          LIVE_GITHUB_PROJECT_NUMBER: ${{ vars.LIVE_GITHUB_PROJECT_NUMBER }}
          LIVE_STATUS_FIELD_NAME: ${{ vars.LIVE_STATUS_FIELD_NAME }}
          LIVE_STATUS_FIELD_STARTED: ${{ vars.LIVE_STATUS_FIELD_STARTED }}
          LIVE_STATUS_FIELD_ON_HOLD: ${{ vars.LIVE_STATUS_FIELD_ON_HOLD }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_IMAGE: cold-seance:test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker build -t "$TEST_IMAGE" .
      - run: npm run test:image

  # The Windows portable zip (SC-120 to SC-123, DD-061), built and tested on Windows.
  windows:
    name: Windows package
    uses: ./.github/workflows/windows-package.yml

  # The build of main, published as `main` once every check has passed (SC-130, DD-040). Pushes to
  # main do not run CI (#196), so publishing takes a manual dispatch on main. Releases, and with
  # them `latest`, which the Compose install runs (SC-029), are published by release-image.yml.
  publish:
    name: Publish the image
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [static, unit, integration, e2e, build, image]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tags: type=raw,value=main
