name: Live GitHub tests

# The live GitHub test suite (SC-127, DD-062): against the test deployment and a real test
# repository. It needs the deployment running and live credentials, so it runs only when started
# by hand from the Actions tab, never on a pull request or a push. Its settings are the secrets and
# variables of the `live` environment, which the deployment's Terraform writes (see "Live GitHub
# tests" in docs/development/live-tests.md); the suite stops, naming each one, if one it needs is
# missing.
on:
  workflow_dispatch:

permissions:
  contents: read

# The same group as the CI job that runs the suite against a backend it starts (SC-129): every run
# works in the one test repository.
concurrency:
  group: live-github-tests
  cancel-in-progress: false

jobs:
  live:
    name: Live GitHub tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: live
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          LIVE_ADMIN_USERNAME: ${{ vars.LIVE_ADMIN_USERNAME }}
          LIVE_ADMIN_PASSWORD: ${{ secrets.LIVE_ADMIN_PASSWORD }}
          LIVE_GITHUB_REPOSITORY: ${{ vars.LIVE_GITHUB_REPOSITORY }}
          LIVE_GITHUB_TOKEN: ${{ secrets.LIVE_GITHUB_TOKEN }}
          LIVE_GITHUB_PROJECTS_TOKEN: ${{ secrets.LIVE_GITHUB_PROJECTS_TOKEN }}
          LIVE_GITHUB_PROJECT_OWNER: ${{ vars.LIVE_GITHUB_PROJECT_OWNER }}
          LIVE_GITHUB_PROJECT_NUMBER: ${{ vars.LIVE_GITHUB_PROJECT_NUMBER }}
          LIVE_STATUS_FIELD_NAME: ${{ vars.LIVE_STATUS_FIELD_NAME }}
          LIVE_STATUS_FIELD_STARTED: ${{ vars.LIVE_STATUS_FIELD_STARTED }}
          LIVE_STATUS_FIELD_ON_HOLD: ${{ vars.LIVE_STATUS_FIELD_ON_HOLD }}
          LIVE_TIMEZONE: ${{ vars.LIVE_TIMEZONE }}
          LIVE_WAIT_MINUTES: ${{ vars.LIVE_WAIT_MINUTES }}
